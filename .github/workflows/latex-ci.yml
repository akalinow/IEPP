name: LaTeX CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: docker://texlive/texlive:latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Find and compile all LaTeX files
      run: |
        # Find all .tex files in the repository
        tex_files=$(find . -name "set*.tex" -type f)

        if [ -z "$tex_files" ]; then
          echo "No .tex files found in the repository"
          exit 1
        fi

        echo "Found LaTeX files:"
        echo "$tex_files"
        echo ""

        failed=0
        total=0

        for tex_file in $tex_files; do
          total=$((total + 1))
          dir=$(dirname "$tex_file")
          file=$(basename "$tex_file")
          stem=${file%.tex}
          build_dir=".ci-build"

          echo "=========================================="
          echo "Compiling: $tex_file"
          echo "=========================================="

          cd "$dir"

          # Default build: solutions hidden, output to a unique PDF name
          if pdflatex -interaction=nonstopmode -halt-on-error -jobname="${stem}" "$file" >/tmp/latex_default.log 2>&1; then
            pdflatex -interaction=nonstopmode -halt-on-error -jobname="${stem}" "$file" >/tmp/latex_default_2.log 2>&1
            echo "✓ Hidden-solutions build successful: $tex_file -> ${stem}.pdf"
          else
            echo "✗ Hidden-solutions build failed: $tex_file"
            cat /tmp/latex_default.log
            failed=$((failed + 1))
            cd - > /dev/null
            continue
          fi

          # Alternate build: solutions shown via definition switch, output to a different PDF name
          if pdflatex -interaction=nonstopmode -halt-on-error -jobname="${stem}_with_solutions" "\def\showsolutions{} \input{$file}" >/tmp/latex_with_solutions.log 2>&1; then
            pdflatex -interaction=nonstopmode -halt-on-error  -jobname="${stem}_with_solutions" "\def\showsolutions{} \input{$file}" >/tmp/latex_with_solutions_2.log 2>&1
            echo "✓ Shown-solutions build successful: $tex_file -> ${stem}_with_solutions.pdf"
          else
            echo "✗ Shown-solutions build failed: $tex_file"
            cat /tmp/latex_with_solutions.log
            failed=$((failed + 1))
          fi

          cd - > /dev/null
          echo ""
        done

        echo "=========================================="
        echo "Compilation Summary"
        echo "=========================================="
        echo "Total files: $total"
        echo "Failed: $failed"

        if [ $failed -gt 0 ]; then
          echo "Some LaTeX files failed to compile"
          exit 1
        fi

        echo "All LaTeX files compiled successfully!"
        pwd
        ls
        ls -ltr Set_1
    
    - name: Upload PDF artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: compiled-pdfs
        path: "**/*.pdf"
        retention-days: 7
